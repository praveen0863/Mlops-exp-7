name: Practical 9 - Docker CI CD to GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/student-result-api:latest .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-api \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/student-result-api:latest

      - name: Test running container
        run: |
          sleep 5
          curl --fail http://localhost:5000/

      - name: Stop Docker container
        if: always()
        run: docker stop student-result-api || true

      - name: Push Docker image to GHCR
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/student-result-api:latest
